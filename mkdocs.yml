site_name: eventsource-py
site_description: Production-ready event sourcing library for Python
site_url: https://tyevans.github.io/eventsource-py
repo_url: https://github.com/tyevans/eventsource-py
repo_name: tyevans/eventsource-py

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search:
      lang: en
      separator: '[\s\-\.]+'

# Exclude internal development files from the documentation build
exclude_docs: |
  tasks/
  futures/

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Tutorials:
      - tutorials/index.md
      - "2. First Event": tutorials/02-first-event.md
      - "3. First Aggregate": tutorials/03-first-aggregate.md
      - "6. Projections": tutorials/06-projections.md
      - "7. Event Bus": tutorials/07-event-bus.md
      - "8. Testing": tutorials/08-testing.md
      - "11. PostgreSQL": tutorials/11-postgresql.md
      - "14. Snapshotting": tutorials/14-snapshotting.md
      - "16. Multi-Tenancy": tutorials/16-multi-tenancy.md
  - Architecture: architecture.md
  - FAQ: faq.md
  - API Reference:
      - api/index.md
      - Events: api/events.md
      - Aggregates: api/aggregates.md
      - Snapshots: api/snapshots.md
      - Projections: api/projections.md
      - Event Bus: api/bus.md
  - Guides:
      - Repository Pattern: guides/repository-pattern.md
      - Snapshotting: guides/snapshotting.md
      - Event Bus: guides/event-bus.md
      - Subscription Manager: guides/subscriptions.md
      - Multi-Tenancy: guides/multi-tenant.md
      - Observability: guides/observability.md
      - Error Handling: guides/error-handling.md
  - Examples:
      - Projections: examples/projections.md
  - ADRs:
      - adrs/index.md
      - "ADR-0001: Async-First Design": adrs/0001-async-first-design.md
      - "ADR-0022: Command Objects & Decider Style": adrs/0022-command-objects-and-decider-style.md
  - Development:
      - Code Structure: development/code-structure.md
      - Testing: development/testing.md
      - Mutation Testing: development/mutation-testing.md
