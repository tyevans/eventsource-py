[project]
name = "eventsource-py"
version = "0.7.0"
description = "Production-ready event sourcing library for Python"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Ty Evans", email = "tyevans@gmail.com"}
]
keywords = ["event-sourcing", "cqrs", "ddd", "domain-driven-design", "events"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "orjson>=3.9",
]

[project.optional-dependencies]
postgresql = [
    "asyncpg>=0.27.0,<1.0",
]
sqlite = [
    "aiosqlite>=0.19.0,<1.0",
]
redis = [
    "redis>=8.0,<9.0",
]
telemetry = [
    "opentelemetry-api>=1.0,<2.0",
    "opentelemetry-sdk>=1.0,<2.0",
]
rabbitmq = [
    "aio-pika>=9.0.0",
]
kafka = [
    "aiokafka>=0.9.0,<1.0.0",
]
kafka-schema-registry = [
    "aiokafka>=0.9.0,<1.0.0",
    "confluent-kafka>=2.0.0,<3.0.0",
]
all = [
    "eventsource-py[postgresql,sqlite,redis,rabbitmq,kafka,telemetry]",
]
all-backends = [
    "eventsource-py[postgresql,sqlite]",
]
benchmark = [
    "pytest-benchmark>=4.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.100",
    "mypy>=1.8",
    "ruff>=0.14.8,<0.15",
    "testcontainers>=4.0",
    "pre-commit>=4.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "pymdown-extensions>=10.0",
]

[project.urls]
Homepage = "https://github.com/tyevans/eventsource-py"
Documentation = "https://tyevans.github.io/eventsource-py"
Repository = "https://github.com/tyevans/eventsource-py"
Changelog = "https://github.com/tyevans/eventsource-py/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eventsource"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --timeout=60"
# Coverage is intentionally NOT enabled by default here. If it were, every
# scoped pytest invocation (a single file, `-k`, mutation-testing runs, etc.)
# would trip the [tool.coverage.report] fail_under gate below on a partial
# measurement -- exiting nonzero even when every selected test passes. Pass
# coverage flags explicitly for a full-suite run instead, e.g.:
#   uv run pytest tests/unit --cov=src/eventsource --cov-report=term-missing
# CI's test job passes these flags explicitly already (.github/workflows/ci.yml).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: marks tests as integration tests (may require docker)",
    "postgres: marks tests that require PostgreSQL",
    "sqlite: marks tests that require SQLite",
    "redis: marks tests that require Redis",
    "kafka: marks tests that require Kafka (excluded by default, run with '-m kafka')",
    "rabbitmq: marks tests that require RabbitMQ (excluded by default, run with '-m rabbitmq')",
    "slow: marks tests as slow-running",
    "e2e: marks tests as end-to-end integration tests",
    "benchmark: marks tests as performance benchmarks",
]

[tool.coverage.run]
source = ["src/eventsource"]

[tool.coverage.paths]
source = ["src/eventsource"]

[tool.coverage.report]
# Unit-suite coverage measured at 88% (2026-07-29, tests/unit/ only,
# excluding integration/postgres/redis-marked tests). Set slightly below that
# as a regression ratchet, not a stretch target.
fail_under = 87

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "opentelemetry.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "redis.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aio_pika.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiormq.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiosqlite.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiokafka.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "asyncpg"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
# ruff >= 0.14 formats Python code blocks inside Markdown. The snippets in our
# agent and docs Markdown are illustrative and deliberately abbreviated
# (`...` bodies, partial classes); reformatting them serves no one and made
# `ruff format --check .` fail repo-wide. The upper pin above stops a future
# release from silently widening what `--check` covers again.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["eventsource", "bench"]

[tool.bandit]
exclude_dirs = ["tests", "examples"]
skips = ["B101"]  # Allow assert statements

[dependency-groups]
dev = [
    "bandit>=1.9.2",
    "mutmut>=3.0",
    "cosmic-ray>=8.4",
    "mypy>=1.19.0",
    "import-linter>=2.13",
    "pytest-randomly>=3.15",
    "pytest-timeout>=2.3",
    "pip-audit>=2.7",
    "pytest-xdist>=3.5",
]

[tool.mutmut]
source_paths = [
    "src",
]
only_mutate = [
    "src/eventsource/engine.py",
    "src/eventsource/adapters/_sql/dialect.py",
    "src/eventsource/serialization/json.py",
    "src/eventsource/bus/registry.py",
    "src/eventsource/bus/retry.py",
    "src/eventsource/bus/base.py",
    "src/eventsource/bus/rabbitmq/death_headers.py",
    "src/eventsource/bus/rabbitmq/serialization.py",
    "src/eventsource/bus/kafka/serialization.py",
    "src/eventsource/bus/rabbitmq/consumer.py",
    "src/eventsource/bus/kafka/consumer.py",
    "src/eventsource/bus/memory.py",
    # Core-rings surface (Task 14): entities, ports, and adapters
    "src/eventsource/domain",
    "src/eventsource/ports",
    "src/eventsource/adapters",
    "src/eventsource/application",
]
pytest_add_cli_args_test_selection = [
    "tests/unit/test_engine.py",
    "tests/unit/repositories/test_dialect.py",
    "tests/unit/serialization/",
    "tests/unit/bus/test_registry.py",
    "tests/unit/bus/test_retry.py",
    "tests/unit/bus/test_base.py",
    "tests/unit/bus/rabbitmq/",
    "tests/unit/bus/kafka/",
    # Core-rings surface (Task 14)
    "tests/unit/adapters/",
    "tests/unit/application/",
    "tests/unit/domain/",
    "tests/unit/ports/",
    "tests/unit/test_public_api.py",
]
pytest_add_cli_args = ["--no-cov", "-x", "-q", "-p", "no:randomly"]

[tool.importlinter]
root_package = "eventsource"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Infrastructure backends must not import each other"
type = "independence"
modules = [
    "eventsource.stores.postgresql",
    "eventsource.stores.sqlite",
    "eventsource.stores.in_memory",
    "eventsource.bus.redis",
    "eventsource.bus.kafka",
    "eventsource.bus.rabbitmq",
    "eventsource.bus.memory",
]

[[tool.importlinter.contracts]]
name = "Tier 0 modules must not import sqlalchemy"
type = "forbidden"
source_modules = [
    "eventsource.events.base",
    "eventsource.events.registry",
    "eventsource.domain.aggregate",
    "eventsource.domain.decider",
    "eventsource.commands",
    "eventsource.protocols",
    "eventsource.stores.interface",
    "eventsource.bus.interface",
    "eventsource.ports",
    "eventsource.application",
    "eventsource.handlers.decorators",
    "eventsource.handlers.registry",
    "eventsource.handlers.adapter",
    "eventsource.exceptions",
    "eventsource.types",
    "eventsource.stores.in_memory",
    "eventsource.bus.memory",
    "eventsource.adapters.memory.snapshots",
    "eventsource.adapters.memory.checkpoints",
    "eventsource.adapters.memory.dlq",
    "eventsource.testing.builder",
    "eventsource.testing.assertions",
    "eventsource.testing.conformance",
    "eventsource.multitenancy.context",
    "eventsource.multitenancy.events",
    "eventsource.multitenancy.exceptions",
    "eventsource.readmodels.base",
    "eventsource.readmodels.query",
    "eventsource.readmodels.schema",
    "eventsource.readmodels.repository",
    "eventsource.readmodels.in_memory",
    "eventsource.readmodels.exceptions",
    "eventsource.multitenancy.repository",
]
forbidden_modules = ["sqlalchemy"]

[[tool.importlinter.contracts]]
name = "Application ring must not import adapters"
type = "forbidden"
source_modules = ["eventsource.application"]
forbidden_modules = ["eventsource.adapters", "eventsource.bus", "eventsource.repositories", "eventsource.locks"]

# The projections/ Tier-0 blocker documented in docs/core-surface.md (projections/base.py
# and the checkpoint/dlq managers pulling in sqlalchemy-backed repositories.checkpoint and
# repositories.dlq) is resolved: projections/ and repositories/{checkpoint,dlq}.py were
# deleted in favor of eventsource.ports.{checkpoints,dlq} (pure) and
# eventsource.adapters.{sql,memory}.{checkpoints,dlq} (sqlalchemy-backed). See the
# projections-ring slice report for detail.
