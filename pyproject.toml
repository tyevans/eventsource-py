[project]
name = "eventsource-py"
version = "0.11.0"
description = "Production-ready event sourcing library for Python"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Ty Evans", email = "tyevans@gmail.com"}
]
keywords = ["event-sourcing", "cqrs", "ddd", "domain-driven-design", "events"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.8.0,<3.0",
    # The [asyncio] extra, not bare sqlalchemy: everything here uses
    # create_async_engine, which needs greenlet. SQLAlchemy gates its greenlet
    # dependency behind a platform marker that excluded Python 3.13 until
    # 2.0.37, so a bare "sqlalchemy" install on 3.13 resolves and imports
    # perfectly and then fails every async call with "the greenlet library is
    # required". Naming the extra states the requirement we actually have
    # instead of inheriting it by accident. See
    # docs/development/dependency-floors.md.
    "sqlalchemy[asyncio]>=2.0.43,<3.0",
    "orjson>=3.10.7",
]

[project.optional-dependencies]
postgresql = [
    "asyncpg>=0.30.0,<1.0",
]
sqlite = [
    "aiosqlite>=0.19.0,<1.0",
]
redis = [
    "redis>=8.0,<9.0",
]
telemetry = [
    "opentelemetry-api>=1.16.0,<2.0",
    "opentelemetry-sdk>=1.16.0,<2.0",
]
rabbitmq = [
    "aio-pika>=9.0.5",
]
kafka = [
    "aiokafka>=0.12.0,<1.0.0",
]
kafka-schema-registry = [
    "aiokafka>=0.12.0,<1.0.0",
    "confluent-kafka>=2.6.0,<3.0.0",
]
all = [
    "eventsource-py[postgresql,sqlite,redis,rabbitmq,kafka,telemetry]",
]
all-backends = [
    "eventsource-py[postgresql,sqlite]",
]
benchmark = [
    "pytest-benchmark>=4.0.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.100",
    # Keep in step with the `mypy` pin in [dependency-groups] dev below --
    # they resolve together, and a lower floor here silently hands
    # `pip install -e ".[dev]"` users a mypy that fails the strict config.
    "mypy>=1.19.0",
    "ruff>=0.14.8,<0.17",
    "testcontainers>=4.0",
    "pre-commit>=4.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "pymdown-extensions>=10.0",
]

[project.urls]
Homepage = "https://github.com/tyevans/eventsource-py"
Documentation = "https://tyevans.github.io/eventsource-py"
Repository = "https://github.com/tyevans/eventsource-py"
Changelog = "https://github.com/tyevans/eventsource-py/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eventsource"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --timeout=60"
# Coverage is intentionally NOT enabled by default here. If it were, every
# scoped pytest invocation (a single file, `-k`, mutation-testing runs, etc.)
# would trip the [tool.coverage.report] fail_under gate below on a partial
# measurement -- exiting nonzero even when every selected test passes. Pass
# coverage flags explicitly for a full-suite run instead, e.g.:
#   uv run pytest tests/unit --cov=src/eventsource --cov-report=term-missing
# CI's test job passes these flags explicitly already (.github/workflows/ci.yml).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: marks tests as integration tests (may require docker)",
    "postgres: marks tests that require PostgreSQL",
    "sqlite: marks tests that require SQLite",
    "redis: marks tests that require Redis",
    "kafka: marks tests that require Kafka (excluded by default, run with '-m kafka')",
    "rabbitmq: marks tests that require RabbitMQ (excluded by default, run with '-m rabbitmq')",
    "slow: marks tests as slow-running",
    "e2e: marks tests as end-to-end integration tests",
    "benchmark: marks tests as performance benchmarks",
]

[tool.coverage.run]
source = ["src/eventsource"]

[tool.coverage.paths]
source = ["src/eventsource"]

[tool.coverage.report]
# Unit-suite coverage measured at 92% (2026-08-01, tests/unit/ only,
# excluding integration/postgres/redis-marked tests). A regression ratchet,
# not a stretch target: raise it when measured coverage rises, never to force
# new tests. Note the margin here is thin -- measured was 92.01% -- so a
# change that leaves a few lines uncovered will fail the gate rather than
# merely warn.
fail_under = 92

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "opentelemetry.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "redis.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aio_pika.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiormq.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiosqlite.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiokafka.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "asyncpg"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py313"
# ruff >= 0.14 formats Python code blocks inside Markdown. The snippets in our
# agent and docs Markdown are illustrative and deliberately abbreviated
# (`...` bodies, partial classes); reformatting them serves no one and made
# `ruff format --check .` fail repo-wide. This exclude is what fixes that; the
# upper pin above is a second line of defence against a release silently
# widening what `--check` covers again. The pin now admits 0.15 and 0.16, so
# that defence is thinner than it was -- `uv.lock` still pins one exact
# version, and crossing a minor is a deliberate `uv lock --upgrade`.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["eventsource", "bench"]

[tool.bandit]
exclude_dirs = ["tests", "examples"]
skips = ["B101"]  # Allow assert statements

[dependency-groups]
dev = [
    "bandit>=1.9.2",
    "mutmut>=3.0",
    "cosmic-ray>=8.4",
    "mypy>=1.19.0",
    "import-linter>=2.13",
    "pytest-randomly>=3.15",
    "pytest-timeout>=2.3",
    "pip-audit>=2.7",
    "pytest-xdist>=3.5",
]

[tool.mutmut]
source_paths = [
    "src",
]
only_mutate = [
    "src/eventsource/adapters/_sql/engine.py",
    "src/eventsource/adapters/_sql/dialect.py",
    "src/eventsource/adapters/serialization/json.py",
    "src/eventsource/adapters/_bus/registry.py",
    "src/eventsource/adapters/_bus/retry.py",
    "src/eventsource/adapters/_bus/base.py",
    "src/eventsource/adapters/rabbitmq/death_headers.py",
    "src/eventsource/adapters/rabbitmq/serialization.py",
    "src/eventsource/adapters/kafka/serialization.py",
    "src/eventsource/adapters/rabbitmq/consumer.py",
    "src/eventsource/adapters/kafka/consumer.py",
    "src/eventsource/adapters/memory/bus.py",
    # Core-rings surface (Task 14): entities, ports, and adapters
    "src/eventsource/domain",
    "src/eventsource/ports",
    "src/eventsource/adapters",
    "src/eventsource/application",
]
pytest_add_cli_args_test_selection = [
    "tests/unit/test_engine.py",
    "tests/unit/repositories/test_dialect.py",
    "tests/unit/adapters/serialization/",
    "tests/unit/adapters/_bus/test_registry.py",
    "tests/unit/adapters/_bus/test_retry.py",
    "tests/unit/adapters/_bus/test_base.py",
    "tests/unit/adapters/rabbitmq/",
    "tests/unit/adapters/kafka/",
    # Core-rings surface (Task 14)
    "tests/unit/adapters/",
    "tests/unit/application/",
    "tests/unit/domain/",
    "tests/unit/ports/",
    "tests/unit/test_public_api.py",
]
pytest_add_cli_args = ["--no-cov", "-x", "-q", "-p", "no:randomly"]

[tool.importlinter]
root_package = "eventsource"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Infrastructure backends must not import each other"
type = "independence"
modules = [
    "eventsource.adapters.postgresql",
    "eventsource.adapters.sqlite",
    "eventsource.adapters.memory",
    "eventsource.adapters.redis",
    "eventsource.adapters.kafka",
    "eventsource.adapters.rabbitmq",
]

[[tool.importlinter.contracts]]
name = "Tier 0 modules must not import a database or broker driver"
type = "forbidden"
source_modules = [
    "eventsource.domain.event",
    "eventsource.domain.event_registry",
    "eventsource.domain.aggregate",
    "eventsource.domain.decider",
    "eventsource.domain.command",
    "eventsource.ports",
    "eventsource.application",
    "eventsource.domain.decorators",
    "eventsource.adapters._bus",
    "eventsource.domain.exceptions",
    "eventsource.domain.types",
    "eventsource.adapters.memory.bus",
    "eventsource.adapters.memory.snapshots",
    "eventsource.adapters.memory.checkpoints",
    "eventsource.adapters.memory.dlq",
    "eventsource.adapters.memory.outbox",
    "eventsource.adapters.memory.locks",
    "eventsource.adapters.memory.readmodels",
    "eventsource.adapters.memory.coordination",
    "eventsource.testing.builder",
    "eventsource.testing.assertions",
    "eventsource.testing.conformance",
    "eventsource.testing.sync_facade",
    "eventsource.adapters.sync.adapter",
    "eventsource.domain.tenant_context",
    "eventsource.domain.tenant_events",
]
forbidden_modules = [
    "sqlalchemy",
    "redis",
    "asyncpg",
    "aiosqlite",
    "aiokafka",
    "aio_pika",
]

# Full ring layering (ADR 0034). Higher layers may import lower, never the
# reverse: adapters -> application -> ports -> domain. This subsumes the two
# targeted forbidden contracts that previously guarded application->adapters
# and ports->{adapters,application}, and adds the domain ring (domain may not
# name ports, application, or adapters). Packages outside the four rings
# (observability, testing) are deliberately unconstrained here. Note this
# catches by-name dependencies the
# Tier 0 sqlalchemy contract cannot: e.g. ports/readmodels importing
# eventsource.adapters.sql.readmodel_schema would break layering even though
# readmodel_schema itself imports no sqlalchemy (ADR 0029 gap, closed here).
[[tool.importlinter.contracts]]
name = "Ring layering: adapters over application over ports over domain"
type = "layers"
layers = [
    "eventsource.adapters",
    "eventsource.application",
    "eventsource.ports",
    "eventsource.domain",
]

# Out-of-ring settlement (ADR 0040). observability/ is the cross-cutting
# telemetry toolkit (OTel optional/guarded), consumed by application and
# adapters by design — but the two innermost rings must stay free of it:
# domain entities and port contracts carry no telemetry. testing/ is the
# public test toolkit; it imports adapters by design and no ring may ever
# import it back.
[[tool.importlinter.contracts]]
name = "Domain and ports must not import observability"
type = "forbidden"
source_modules = [
    "eventsource.domain",
    "eventsource.ports",
]
forbidden_modules = ["eventsource.observability"]

[[tool.importlinter.contracts]]
name = "Rings must not import the testing toolkit"
type = "forbidden"
source_modules = [
    "eventsource.domain",
    "eventsource.ports",
    "eventsource.application",
    "eventsource.adapters",
]
forbidden_modules = ["eventsource.testing"]

# The projections/ Tier-0 blocker documented in docs/core-surface.md (projections/base.py
# and the checkpoint/dlq managers pulling in sqlalchemy-backed repositories.checkpoint and
# repositories.dlq) is resolved: projections/ and repositories/{checkpoint,dlq}.py were
# deleted in favor of eventsource.ports.{checkpoints,dlq} (pure) and
# eventsource.adapters.{sql,memory}.{checkpoints,dlq} (sqlalchemy-backed). See the
# projections-ring slice report for detail. The outbox slice went further and deleted
# eventsource.repositories/ outright: its sole remaining member (the transactional outbox)
# moved to eventsource.ports.outbox (pure) and eventsource.adapters.{memory,postgresql,
# sqlite}.outbox (backend-specific), so "eventsource.repositories" no longer exists to
# forbid above.

# eventsource.readmodels.schema (now eventsource.adapters.sql.readmodel_schema) lost its
# "must not import sqlalchemy" Tier 0 guard by design when it moved (ADR 0029 SS2.3): the
# guard asserted the wrong property. The module has never imported sqlalchemy -- it
# hardcodes POSTGRESQL_TYPE_MAP/SQLITE_TYPE_MAP and emits dialect-specific DDL text as
# plain strings -- but dialect knowledge is an adapter concern regardless of whether the
# code happens to avoid the sqlalchemy import to express it. The guard was not silently
# dropped; the property it should have been asserting (does this module encode
# backend-specific knowledge) was never "imports sqlalchemy" to begin with.
