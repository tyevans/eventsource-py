# cosmic-ray config for the decorated-function slice of checkpoint.py.
# See engine.toml and docs/development/mutation-testing.md ("Two tools, two
# jobs") for why this exists alongside mutmut: mutmut 3.x cannot generate a
# mutant inside (or removing) a decorated function. checkpoint.py's
# `SQLCheckpointRepository._connect` is `@asynccontextmanager`-decorated and
# is exactly the method that implements the caller-owns-the-transaction
# contract this task's regression test (test_repository_does_not_commit)
# exists to protect -- mutmut generates zero mutants for it, confirmed by
# grepping the mutmut run output for "_connect__mutmut" (no hits).
#
# Run with `scripts/mutation-cosmic-ray.sh checkpoint`.
#
# Deliberately scoped to one file; do not widen module-path (see engine.toml
# for the runtime-cost rationale).

[cosmic-ray]
module-path = "src/eventsource/repositories/checkpoint.py"
timeout = 10.0
excluded-modules = []
test-command = "python -m pytest tests/unit/test_checkpoint_repository.py tests/unit/test_checkpoint_position.py tests/unit/repositories/test_checkpoint_tracing.py -x -q --no-cov -p no:randomly"

[cosmic-ray.distributor]
name = "local"
