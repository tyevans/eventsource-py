team: eventsource-py
description: "Production-ready event sourcing library for Python (pydantic, sqlalchemy, async-first)"

defaults:
  model: sonnet
  budget: 0.50
  permission-mode: dontAsk

members:
  # Ownership follows the ring architecture (ADRs 0024-0046). The pre-rings
  # directories (stores/, repositories/, infrastructure/, multitenancy/,
  # events/, handlers/, projections/, subscriptions/, top-level protocols.py
  # and exceptions.py) no longer exist.
  #
  # Precedence: `adapters/serialization/**` is the one deliberate overlap --
  # it sits in the adapters ring but is perf-critical core plumbing, so
  # `architect` owns it and `backend`'s broader `adapters/**` yields there.
  # Every other path has exactly one owner.

  - name: architect
    role: "Domain ring, boundary ports, serialization, public front door"
    model: opus
    tools: [Read, Edit, Write, Glob, Grep, Bash]
    owns:
      - "src/eventsource/domain/**"
      - "src/eventsource/ports/**"
      - "src/eventsource/adapters/serialization/**"
      - "src/eventsource/__init__.py"

  - name: backend
    role: "Adapters ring -- concrete store, bus, and repository bindings"
    tools: [Read, Edit, Write, Glob, Grep, Bash]
    owns:
      - "src/eventsource/adapters/**"

  - name: domain
    role: "Application ring -- aggregate repositories, projections, subscriptions, migration"
    tools: [Read, Edit, Write, Glob, Grep, Bash]
    owns:
      - "src/eventsource/application/**"

  - name: tester
    role: "Test strategy, coverage, fixtures, benchmarks, test helpers"
    tools: [Read, Edit, Write, Glob, Grep, Bash]
    owns:
      - "tests/**"
      - "src/eventsource/testing/**"
