[project]
name = "eventsource-py"
repo = ""
docs_dir = "docs/project"
site_output = "dist/site"

[documentation]
allowed_directories = ["adrs", "api", "development", "examples", "guides", "superpowers"]
allowed_root_files = [
  "index.md",
  "architecture.md",
  "core-surface.md",
  "faq.md",
  "getting-started.md",
  "installation.md",
  "operating-manual.md",
  "contributing.md",
]

[architecture]
file_length_limit = 500
buffer_target = 10
buffer_warning_threshold = 6

components = [
  { id = "domain", name = "Domain Models & Business Invariants", path = "src/eventsource/domain" },
  { id = "ports", name = "Ports & Pure Interfaces", path = "src/eventsource/ports" },
  { id = "application", name = "Application Services & Orchestration", path = "src/eventsource/application" },
  { id = "adapters", name = "Infrastructure & Technology Adapters", path = "src/eventsource/adapters" },
  { id = "observability", name = "Telemetry & Tracing Toolkit", path = "src/eventsource/observability" },
  { id = "testing", name = "Testing Harness & Fixtures", path = "src/eventsource/testing" }
]

[vertical_slices]
slices = [
  { type = "spike", name = "Architectural Spike", prefix = "SPIKE:", requires_adr = true },
  { type = "domain", name = "Domain Model & State Handlers" },
  { type = "api", name = "Public API Contracts" },
  { type = "ui", name = "User Interface & Component Stories" },
  { type = "test", name = "Blackbox Frontdoor Test Suite" }
]

[quality]
testing_style = "blackbox-frontdoor"
require_bdd = true
preflight = [
  "uv run pytest -m \"not integration and not postgres and not redis and not e2e and not benchmark\""
]

[execution]
agent_command = "agy --dangerously-skip-permissions -p {prompt}"
agent_max_attempts = 3
git_branch_prefix = "feat/"
backlog_isolation = true

[security]
secret_scanning = true
lockfile_immutability = true
enforce_lockfile = true
sandbox_enabled = true
allowed_commands = ["pytest", "git", "uv", "make", "ruff", "mypy"]
reporting_contact = "security@example.com"

[security.licenses]
profile = "permissive"
allowed = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "0BSD",
  "Unlicense",
  "Python-2.0",
  "CC0-1.0",
  "PSF-2.0",
  "MPL-2.0",
  "CNRI-Python",
  "LGPL-3.0",
  "UNKNOWN",
]

[profiles]
installed = ["core", "bdd", "ddd"]
version = "0.1.0"

[invariants.file_limits]
grandfathered = []

[audit.provenance]
baseline_commit = "2876453af67cd4bcf80395cf2234c2adf5a01639"
