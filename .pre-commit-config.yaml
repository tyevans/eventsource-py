# Hooks that lint Python are `language: system` and shell out through
# `uv run`, so they use the versions pinned in uv.lock -- the same ones the
# Makefile and .github/workflows/ci.yml use. Run `uv sync --all-extras`
# once and they resolve.
#
# The alternative (pre-commit managing its own isolated envs via `rev:` and
# `additional_dependencies:`) means a third set of tool versions and a
# hand-maintained copy of the project's runtime dependencies for mypy to
# type against. That list had already drifted -- it was missing orjson, a
# core dependency -- so mypy failed here while passing in CI and locally.
#
# Non-Python hygiene hooks below keep using pre-commit's own environments;
# they have no project dependencies to drift from. `debug-statements` still
# parses Python source, though, so it needs an interpreter that understands
# this project's floor -- Python 3.13, required since ADR 0043 for native
# PEP 695/696 syntax (e.g. `class Foo[T: Bound = default]`). Without this
# pin, pre-commit provisions whatever `python3` resolves to on PATH, which
# can be older and fails to parse that syntax with a SyntaxError.
default_language_version:
  python: python3.13
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: debug-statements

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy
        entry: uv run mypy --config-file=pyproject.toml
        language: system
        types: [python]
        files: ^src/
        require_serial: true

      # Scoped to src/ to match the `audit` job in CI, which runs
      # `bandit -r src/`. Dev tooling under scripts/ is not shipped.
      - id: bandit
        name: bandit
        entry: uv run bandit -c pyproject.toml
        language: system
        types: [python]
        files: ^src/
        require_serial: true

      - id: import-linter
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        files: ^(src/eventsource/|pyproject\.toml)
