# CI Workflow
# Runs linting, type checking, and tests on push and pull requests
#
# Jobs:
# - lint: ruff check and format verification
# - type-check: mypy strict type checking
# - import-linter: architecture layering contracts (pyproject.toml [tool.importlinter])
# - audit: pip-audit dependency vulnerability scan
# - test: pytest with coverage (matrix: Python 3.11, 3.12)
#
# Every job installs with `uv sync --all-extras --locked` and runs tools via
# `uv run`, so CI executes the exact versions pinned in uv.lock -- the same
# ones the Makefile uses locally. `make check` and this workflow therefore
# agree by construction.
#
# Do not switch these back to `pip install -e ".[dev,all]"`. That ignores
# uv.lock (floating tool versions above their pins) and silently skips
# [dependency-groups] dev, because pip does not install PEP 735 groups
# without --group. pip-audit, import-linter, bandit and pytest-timeout live
# only in that group, so those jobs fail with "command not found".
#
# `--locked` makes a stale uv.lock a CI failure rather than a silent
# resolution drift. If it trips, run `uv lock` and commit the result.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:  # Allow release workflow to call this

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Linting with ruff
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

  # Type checking with mypy
  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Run mypy
        run: uv run mypy src/ --config-file=pyproject.toml

  # Architecture layering contracts
  import-linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Run import-linter
        run: uv run lint-imports

  # Security linting and dependency vulnerability scanning
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Run bandit
        run: uv run bandit -c pyproject.toml -r src/

      - name: Run pip-audit
        run: uv run pip-audit

  # Testing with pytest
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Run tests
        run: |
          uv run pytest --cov=src/eventsource --cov-report=xml --cov-report=term-missing \
            -m "not integration and not postgres and not redis and not e2e"

      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # Integration tests (optional, requires services)
  integration:
    runs-on: ubuntu-latest
    needs: [lint, type-check, import-linter, audit, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: eventsource_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/eventsource_test
          REDIS_URL: redis://localhost:6379
        run: |
          uv run pytest -m "integration or postgres or redis" \
            --cov=src/eventsource --cov-report=term-missing
