# CI Workflow
# Runs linting, type checking, and tests on push and pull requests
#
# Jobs:
# - lint: ruff check and format verification
# - type-check: mypy strict type checking
# - import-linter: architecture layering contracts (pyproject.toml [tool.importlinter])
# - audit: pip-audit dependency vulnerability scan
# - secrets: gitleaks secret scan over full git history (.gitleaks.toml)
# - test: pytest with coverage (matrix: Python 3.13)
#
# Every job installs with `uv sync --all-extras --locked` and runs tools via
# `uv run`, so CI executes the exact versions pinned in uv.lock -- the same
# ones the Makefile uses locally. `make check` and this workflow therefore
# agree by construction.
#
# Do not switch these back to `pip install -e ".[dev,all]"`. That ignores
# uv.lock (floating tool versions above their pins) and silently skips
# [dependency-groups] dev, because pip does not install PEP 735 groups
# without --group. pip-audit, import-linter, bandit and pytest-timeout live
# only in that group, so those jobs fail with "command not found".
#
# `--locked` makes a stale uv.lock a CI failure rather than a silent
# resolution drift. If it trips, run `uv lock` and commit the result.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_call:  # Allow release workflow to call this

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Linting with ruff
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.12.21'
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      # Supply-chain guard: every third-party `uses:` must name a full
      # 40-hex commit SHA (the tag goes in a trailing comment). Local
      # reusable-workflow refs (`uses: ./...`) are exempt.
      - name: Check actions are pinned to commit SHAs
        run: |
          bad=$(grep -rnE '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows/ \
            | grep -vE 'uses:[[:space:]]+\./' \
            | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true)
          if [[ -n "$bad" ]]; then
            echo "::error::These uses: lines are not pinned to a 40-character commit SHA:"
            echo "$bad"
            exit 1
          fi
          echo "All uses: lines are pinned to commit SHAs"

  # Type checking with mypy
  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.12.21'
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Run mypy
        run: uv run mypy src/ --config-file=pyproject.toml

  # Architecture layering contracts
  import-linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.12.21'
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Run import-linter
        run: uv run lint-imports

  # Security linting and dependency vulnerability scanning
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.12.21'
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Run bandit
        run: uv run bandit -c pyproject.toml -r src/

      - name: Run pip-audit
        run: uv run pip-audit

  # Secret scanning with gitleaks. fetch-depth 0 scans the full history, so a
  # credential that was committed and later removed is still reported.
  # Mirrors the local `gitleaks` hook in .pre-commit-config.yaml. Rules and
  # allowlist live in .gitleaks.toml.
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Testing with pytest
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.12.21'
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Run tests
        run: |
          uv run pytest -n auto --dist worksteal \
            --cov=src/eventsource --cov-report=xml --cov-report=term-missing \
            -m "not integration and not postgres and not redis and not e2e"

      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # Redis bus tests. Runs on every PR, unlike the broader `integration` job
  # below, so the shipped `redis` extra's supported range stays verified
  # against a real server instead of only on pushes to main.
  redis:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.12.21'
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Run redis tests
        env:
          REDIS_URL: redis://localhost:6379
        run: uv run pytest -m redis

  # Integration tests (optional, requires services)
  integration:
    runs-on: ubuntu-latest
    needs: [lint, type-check, import-linter, audit, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgres:16@sha256:dd2bf3ce2dc83a81674cf7f217fcfd8a5009a4b325dda5b843bfee82a06cff6f
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: eventsource_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7@sha256:2e3eb11462c4e3759e6972678dd051d150ff54b1e60714b3c33b701260172a90
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.12.21'
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --locked

      # --cov-fail-under=0 overrides [tool.coverage.report] fail_under, which is
      # a ratchet calibrated against the unit suite. This job measures only the
      # integration selection, so enforcing that gate here compares a partial
      # measurement (~52%) to a whole-suite threshold (86) and always fails. The
      # report is still printed; it just does not gate.
      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/eventsource_test
          REDIS_URL: redis://localhost:6379
        run: |
          uv run pytest -m "integration or postgres or redis" \
            --cov=src/eventsource --cov-report=term-missing --cov-fail-under=0

  # Broker integration tests (Kafka, RabbitMQ).
  #
  # Unlike the `integration` job above, these tests don't talk to a fixed
  # `services:` container: tests/integration/bus/{test_kafka,test_rabbitmq}.py
  # use testcontainers-python to start their own ephemeral broker container
  # per session (via the Docker socket) and read back its dynamically
  # assigned host/port -- there are no KAFKA_BOOTSTRAP_SERVERS / RABBITMQ_URL
  # env vars to wire up. GitHub-hosted ubuntu-latest runners have Docker
  # available out of the box, so no `services:` block is needed here.
  broker-tests:
    runs-on: ubuntu-latest
    needs: [lint, type-check, import-linter, audit, test]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.12.21'
          python-version: '3.13'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --locked

      - name: Run broker integration tests
        # Exclude benchmark-marked tests: wall-clock threshold assertions are nondeterministic on shared runners
        run: uv run pytest -m "(kafka or rabbitmq) and not benchmark" --no-cov
